name: STRM 播放代理回归测试

on:
  pull_request:
    paths:
      - plugins.v2/cloudsubscribe/core/api/strm_proxy.py
      - plugins.v2/cloudsubscribe/utils/strm.py
      - tests/test_strm_proxy.py
      - tests/plugin_env.py
      - .github/workflows/strm-proxy-tests.yml
  push:
    branches:
      - dev/fix-quark-strm-relay

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install starlette
      - name: 验证跳转及夸克认证中转、HEAD、Range 和错误响应
        run: python -m unittest discover -s tests -p test_strm_proxy.py -v
