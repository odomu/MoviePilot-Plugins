name: 夸克与 UC 分享文件遍历回归测试

on:
  pull_request:
    paths:
      - plugins.v2/cloudsubscribe/drive/quark/**
      - plugins.v2/cloudsubscribe/drive/uc/**
      - tests/test_quark_uc_share_listing.py
      - .github/workflows/share-listing-tests.yml
  push:
    branches:
      - dev/fix-quark-uc-share-files
    paths:
      - plugins.v2/cloudsubscribe/drive/quark/**
      - plugins.v2/cloudsubscribe/drive/uc/**
      - tests/test_quark_uc_share_listing.py
      - .github/workflows/share-listing-tests.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 验证真实文件、父目录、分页及转存令牌
        run: python -m unittest discover -s tests -p test_quark_uc_share_listing.py -v
